name: Check flight prices

on:
  schedule:
    # 06:15, 12:15, 18:15 Israel time (UTC+3 in summer / +2 in winter)
    - cron: "15 3,9,15 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification only"
        type: boolean
        default: false
  push:
    paths: ["docs/watches.json"]

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracker/requirements.txt
      - run: pip install -r tracker/requirements.txt

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python tracker/check.py --test-alert
          else
            python tracker/check.py
          fi

      - name: Save results
        if: ${{ inputs.test_alert != true && inputs.test_alert != 'true' }}
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "prices $(date -u +%F\ %H:%M)"
          git pull --rebase --autostash && git push
